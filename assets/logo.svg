<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background -->
  <rect width="200" height="200" rx="30" fill="#07C160"/>
  
  <!-- WeChat Icon Style Speech Bubbles -->
  <g fill="white">
    <!-- Main bubble -->
    <path d="M65 55 C45 55 30 70 30 90 C30 105 40 118 55 123 L55 135 L70 125 C75 126 80 127 85 127 C105 127 120 112 120 92 C120 72 105 55 85 55 Z"/>
    
    <!-- Secondary bubble -->
    <path d="M125 85 C110 85 98 95 98 108 C98 118 105 126 115 129 L115 138 L125 131 C128 132 132 132 135 132 C150 132 162 122 162 109 C162 96 150 85 135 85 Z" opacity="0.9"/>
  </g>
  
  <!-- RSS/Article indicator dots -->
  <g fill="#07C160">
    <circle cx="55" cy="90" r="5"/>
    <circle cx="75" cy="90" r="5"/>
    <circle cx="95" cy="90" r="5"/>
  </g>
  
  <!-- Fetch arrow -->
  <g stroke="white" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M140 145 L155 160 L170 145"/>
    <line x1="155" y1="130" x2="155" y2="160"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="170" cy="40" r="8" fill="white" opacity="0.3"/>
  <circle cx="30" cy="160" r="6" fill="white" opacity="0.2"/>
  <circle cx="180" cy="170" r="4" fill="white" opacity="0.25"/>
</svg>
